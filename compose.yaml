# Lancement : podman-compose up -d --build    (ou : docker compose up -d --build)
# Modèle par défaut : qwen2.5:3b-64k (léger et fluide sur CPU)

services:
  # --- LE CERVEAU : totalement isolé (réseau interne, aucune route vers Internet) ---
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-brain
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama:z      # ":z" (minuscule) car le volume est partagé avec ollama-pull
      - ./Modelfile:/Modelfile:ro
    networks:
      - ollama-isolated

  # --- TÉLÉCHARGEMENT & CRÉATION AUTOMATIQUE DU MODÈLE ---
  ollama-pull:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-pull
    restart: "no"
    volumes:
      - ollama_data:/root/.ollama:z
      - ./Modelfile:/Modelfile:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve >/dev/null 2>&1 &
        until ollama list >/dev/null 2>&1; do sleep 2; done
        
        # 1. Télécharge la base 3B si elle n'est pas présente
        ollama list | grep -qF "qwen2.5:3b" || ollama pull qwen2.5:3b
        
        # 2. Crée automatiquement le modèle personnalisé -64k basé sur le Modelfile
        ollama create qwen2.5:3b-64k -f /Modelfile
        
        echo "Modèle 3B-64k prêt."

  # --- RELAIS : transmet uniquement le port 11434 de la VM vers Ollama ---
  ollama-gateway:
    image: docker.io/alpine/socat:latest
    container_name: ollama-gateway
    restart: unless-stopped
    command: TCP-LISTEN:11434,fork,reuseaddr TCP:ollama:11434
    ports:
      - "127.0.0.1:11434:11434"          # accessible uniquement depuis la VM
    networks:
      - ollama-isolated
      - default
    depends_on:
      - ollama

  # --- L'ORCHESTRATEUR (HERMES) ---
  hermes:
    build:
      context: .
      args:
        HERMES_REF: main
    container_name: hermes-agent
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - OLLAMA_MODEL=qwen2.5:3b-64k
    volumes:
      - hermes_data:/root/.hermes:Z
    depends_on:
      - ollama-gateway

volumes:
  ollama_data:
  hermes_data:

networks:
  ollama-isolated:
    internal: true                    # aucune route vers l'extérieur
  default:
    driver: bridge